<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Tabs</title>
  <link rel="stylesheet" href="tabs.css" />
  <script src="tabs.js" defer></script>
</head>
<body>
  <div class="strip" id="strip">
    <div class="tabs" id="tabs" role="tablist" aria-label="Open documents"></div>
    <button class="new" id="new" title="New tab" aria-label="New tab">+</button>
    <button class="list" id="list" title="List all tabs" aria-label="List all tabs" hidden>▾</button>
  </div>
</body>
</html>
